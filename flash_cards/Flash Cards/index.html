<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Flash Cards</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="deck-title" id="deckTitle">Flash Cards</div>
      <div class="stats" id="stats"></div>
    </header>

    <div class="deck-switcher" id="deckSwitcher"></div>

    <main class="card-wrap">
      <div class="question-card">
        <p class="question" id="question">Loading…</p>
      </div>

      <div class="options" id="options"></div>

      <div class="feedback" id="feedback" hidden>
        <div class="explanations" id="explanations"></div>
        <button class="next-btn" id="nextBtn">Next card →</button>
      </div>
    </main>

    <footer class="footer">
      <button class="reset-link" id="resetBtn">Reset progress</button>
    </footer>
  </div>

  <script src="js/decks/reinforcement-learning-beginner.js"></script>
  <script src="js/decks/reinforcement-learning-advanced.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
